# Selected Proof tiles (#proof). Each tile: a bold phrase plus one supporting line.
# Keep these short — a skimming reader should absorb the whole set in ~5 seconds.
# Headlines only: no employer revenue figures, adoption statistics or internal product
# detail. Those belong in the CV, which readers request (see CLAUDE.md).

- phrase: "From zero to production"
  detail: "Built DNB Carnegie's Investment Banking Division AI and data capability from nothing over a decade."

- phrase: "Operating leverage"
  detail: "Revenue grew substantially faster than headcount as AI moved into live workflows."

- phrase: "Platform at scale"
  detail: "Governed production AI on proprietary data, used daily across the Nordics, the UK, the US and Singapore."

- phrase: "Governance & reliability"
  detail: "Output built to a banker's and compliance reviewer's defensibility bar; the capability held through a merger and leadership change."

- phrase: "Model & vendor selection"
  detail: "Led the frontier model and vendor evaluations behind institutional AI adoption decisions."

- phrase: "Published research"
  detail: "Author of the Capital Markets LLM Reliability Score and The Checking Problem (arXiv & SSRN)."
