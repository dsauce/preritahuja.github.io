# Research & Writing (#research).
# `intro` is the optional lead line. Each entry: title, author, year, venue, description,
# optional `pullquote`, `licence` and a `links` list. An entry with no `links` renders
# fine (e.g. a paper under review) — omit the list entirely.

intro: "Selected work on making AI output reliable enough to act on in regulated financial workflows."

entries:
  - title: "Capital Markets LLM Reliability Score (CM-LRS): From Plausible to Bankable"
    author: "P. Ahuja"
    year: "2026"
    venue: "arXiv & SSRN"
    description: >-
      A seven-dimension reliability metric for LLM output in capital-markets workflows.
      Demonstrated across five workflows and four models, scored by four independent LLM
      judges from three model families, with a deterministic verification script
      (95 checks, all passing).
    pullquote: >-
      A notable result: two frontier models were statistically indistinguishable on
      reliability despite a material cost difference, which argues for choosing models on
      workflow fit and cost rather than headline quality.
    licence: "CC BY 4.0"
    links:
      - label: "Read on SSRN"
        url: "https://ssrn.com/abstract=6865059"
        primary: true
      - label: "Read on arXiv"
        url: "https://arxiv.org/html/2607.21340v1"
        primary: true
      - label: "Code & data"
        url: "https://github.com/dsauce/cm-lrs"

  - title: "The Checking Problem: What Must Be True Before AI Ships in a Regulated Firm"
    author: "P. Ahuja"
    year: "2026"
    venue: "arXiv"
    description: >-
      A controlled study of why enterprise AI programmes stall. Six document-heavy workflows
      of the kind performed daily in regulated financial services, run across four model
      families and three tool configurations, three times each: 5,093 scored output elements
      across 72 configurations. 57 cleared a demonstration bar; 32 cleared a production bar
      requiring sustained accuracy, reproducibility across repeats, verifiable attribution
      and a confidence signal that carries information. A survival rate of 56.1%.
    pullquote: >-
      A tool that states no confidence requires review of 100% of its output, because it
      offers a reviewer no basis for triage. Requiring it to cite sources and state a
      confidence reduces that to 49%. The value of an AI workflow is set less by how often
      it is right than by how much of it a human must still check.
    licence: "CC BY 4.0"
    links:
      - label: "Read on arXiv"
        url: "https://arxiv.org/html/2607.28666v1"
        primary: true
      - label: "PDF"
        url: "https://arxiv.org/pdf/2607.28666"
