# Speaker kit (#speaker-kit): ready-to-use material for event organisers.
kit:
  intro: "For organisers: bios in three lengths, a headshot and the topics I speak on. Copy freely."
  bios:
    - label: "Short"
      text: >-
        Prerit Ahuja is Director, Global AI and Data Strategy at DNB Carnegie, where he built the
        investment banking division's AI and data capability from zero. HotTopics Global CDO 100 (2026).
    - label: "Medium"
      text: >-
        Prerit Ahuja is Director, Global AI and Data Strategy at DNB Carnegie, where he built the
        investment banking division's AI and data capability from zero and leads its global AI
        taskforce. He takes AI from strategy to daily use in regulated financial services: the
        operating model, the governance and the production systems senior leadership relies on.
        He is the author of the Capital Markets LLM Reliability Score and The Checking Problem,
        and was named to the HotTopics Global CDO 100 in 2026.
    - label: "Long"
      text: >-
        Prerit Ahuja is Director, Global AI and Data Strategy at DNB Carnegie, based in London. Over
        the past decade he has built the investment banking division's AI and data capability from
        zero into a governed platform of production AI used daily across the Nordics, the UK, the US
        and Singapore, and he leads the division's global AI taskforce. His work sits where most AI
        programmes stall: after the model works, in governance, reliability, adoption and proving
        the return. He publishes on that problem. The Capital Markets LLM Reliability Score sets out
        how far LLM output can be trusted in regulated workflows, and The Checking Problem measures
        why AI that passes a demo so often fails in production. Before DNB Carnegie he built an AI
        and data science practice for financial services clients at Capgemini Consulting. He studied
        engineering at IIT Madras, was named to the HotTopics Global CDO 100 in 2026, and speaks at
        AI and financial services conferences across Europe.
  topics:
    - "Proving AI ROI to a CFO"
    - "From pilot to production in a regulated firm"
    - "AI governance that speeds adoption instead of blocking it"
    - "Agentic AI in financial workflows"
    - "LLM reliability: from plausible to bankable"
    - "Proprietary data as the only durable AI advantage"
    - "The Chief AI Officer mandate"
  headshot: "/images/headshot.jpeg"
