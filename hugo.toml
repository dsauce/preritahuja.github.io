baseURL = "https://preritahuja.com/"
languageCode = "en-gb"
defaultContentLanguage = "en-gb"
title = "Prerit Ahuja"

# Single-page site: no taxonomies, no list pages, no RSS.
disableKinds = ["taxonomy", "term", "section", "rss"]

[params]
author = "Prerit Ahuja"

# `seoTitle` is the <title> tag: the browser tab and the blue link in search results.
# It is NOT rendered anywhere on the page — the wordmark, the H1, the OG site name and
# the JSON-LD `name` all stay the plain `title` above. Google truncates the SERP headline
# around 60 characters, so keep it under that and lead with the name.
seoTitle = "Prerit Ahuja | Global AI & Data Strategy, DNB Carnegie"

# Meta description. Not rendered on the page; it is the grey snippet under the search
# result. Google truncates around 155 characters.
description = "Prerit Ahuja, Director of Global AI and Data Strategy at DNB Carnegie. Enterprise AI in regulated financial services. Global CDO 100 (2026). London."

headshot = "/images/headshot.jpeg"
ogImage = "/images/headshot.jpeg"
location = "London"
founded = 2024   # shown in the footer as "Established <year>"
linkedin = "https://www.linkedin.com/in/ahujaprerit/"
orcid = "0009-0004-0147-4192"
orcidURL = "https://orcid.org/0009-0004-0147-4192"

# ---------------------------------------------------------------------------
# Entity signals. None of this renders on the page — it feeds the JSON-LD block
# in layouts/home.html, which is how search engines and AI assistants work out
# that the scattered profiles below are all one person, with this site as the hub.
#
# TOML scoping matters here: these arrays must stay ABOVE the [params.employer]
# table. Anything written after a table header belongs to that table, not to [params].
# ---------------------------------------------------------------------------

# `sameAs` is the identity-consolidation list: other profiles that are provably you.
# Only add profiles you actually control and want associated with your professional
# identity — each one is a claim that it is the same person.
sameAs = [
  "https://www.linkedin.com/in/ahujaprerit/",
  "https://orcid.org/0009-0004-0147-4192",
  "https://github.com/dsauce",
  "https://kinfos.events/speakers/prerit-ahuja/",
]

# Topics this person is an authority on. Feeds `knowsAbout` in the JSON-LD. This is the
# legitimate way to state topical expertise without putting keywords on the page.
knowsAbout = [
  "Chief AI Officer",
  "Enterprise AI strategy",
  "AI governance",
  "AI operating models",
  "Production AI systems",
  "Regulated financial services",
  "Investment banking technology",
  "Capital markets",
  "Large language model reliability",
  "Agentic AI",
  "Retrieval-augmented generation",
  "Data strategy",
  "Machine learning in banking",
]

[params.employer]
name = "DNB Carnegie"
url = "https://www.dnbcarnegie.com/"
jobTitle = "Director, Global AI and Data Strategy"

[params.hero]
headline = "Enterprise Digital & AI Leader | Production AI, Operating Leverage & Decision Systems"
subheadline = "Enterprise AI operating models, built from zero to governed production."
microline = "London · Global CDO Top 100 (2026)"

# Drives the sticky section nav, in order.
#   name  = label in the nav strip
#   title = full section heading
#   cue   = hero scroll-cue wording (first entry only)
#   cta   = hero button label (first entry only)
[[params.nav]]
name = "About"
title = "About"
anchor = "about"
cue = "Scroll to read on"
cta = "About Me"

[[params.nav]]
name = "Proof"
title = "Selected Proof"
anchor = "proof"

[[params.nav]]
name = "Research"
title = "Research & Writing"
anchor = "research"

[[params.nav]]
name = "Speaking"
title = "Speaking"
anchor = "speaking"

[[params.nav]]
name = "Recognition"
title = "Recognition"
anchor = "recognition"

[[params.nav]]
name = "Contact"
title = "Contact"
anchor = "contact"

[markup.goldmark.renderer]
unsafe = true

[minify]
disableXML = true
  [minify.tdewolff.html]
  keepQuotes = true
